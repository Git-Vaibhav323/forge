services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: forgedata
      POSTGRES_PASSWORD: forgedata
      POSTGRES_DB: forgedata
    volumes:
      - forgedata_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedata -d forgedata"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: forgedata
      MINIO_ROOT_PASSWORD: forgedata
    volumes:
      - forgedata_minio:/data

volumes:
  forgedata_pg:
  forgedata_minio:
